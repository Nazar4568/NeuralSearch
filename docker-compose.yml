services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: neural_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always

  api:
    build: .
    container_name: neural_api
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    environment:
      - QDRANT_URL=http://qdrant:6333
      - HF_API_KEY=${HF_API_KEY}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: always

volumes:
  qdrant_storage: